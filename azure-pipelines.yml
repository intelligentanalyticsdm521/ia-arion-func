trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  node_version: "22.x"
  functionAppName: "func-iadm-arion-prod"
  functionAppResourceGroup: "rg-apps-prod"
  azureSubscription: "IADM-Prod-ARM"

steps:
  - task: NodeTool@0
    displayName: "Use Node $(node_version)"
    inputs:
      versionSpec: "$(node_version)"

  - checkout: self
    clean: true

  # Install deps and (optional) build
  - script: |
      set -e
      echo "Working directory:"
      pwd
      ls -la

      echo "Installing dependencies..."
      npm install

      if npm run | grep -q " contract-check"; then
        echo "Running contract-check..."
        npm run contract-check
      fi

      if npm run | grep -q " build"; then
        echo "Running build..."
        npm run build
      fi

      # Keep package smaller (optional, but recommended)
      echo "Pruning dev dependencies..."
      npm prune --omit=dev

      echo "Done."
    displayName: "npm install (+ optional contract-check/build) + prune"

  # Zip the repo INCLUDING node_modules (Flex requires runnable package)
  - script: |
      set -e
      cd "$(System.DefaultWorkingDirectory)"
      echo "Creating deployment zip..."
      zip -r "$(Build.ArtifactStagingDirectory)/drop.zip" . \
        -x ".git/*" \
           ".gitignore" \
           "azure-pipelines.yml" \
           "*.log" \
           "**/*.log"
      ls -lh "$(Build.ArtifactStagingDirectory)/drop.zip"
    displayName: "Create drop.zip (includes node_modules)"

  - task: AzureCLI@2
    displayName: "Deploy drop.zip to $(functionAppName) via az config-zip"
    inputs:
      azureSubscription: "$(azureSubscription)"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        set -e
        echo "Deploying zip package..."
        az functionapp deployment source config-zip \
          --name "$(functionAppName)" \
          --resource-group "$(functionAppResourceGroup)" \
          --src "$(Build.ArtifactStagingDirectory)/drop.zip"
        echo "Deployment complete."