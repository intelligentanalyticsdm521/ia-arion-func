trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  node_version: "22.x"
  functionAppName: "func-iadm-arion-prod"
  functionAppResourceGroup: "rg-core-shared-prod"
  azureSubscription: "IADM-Prod-ARM"
  # Storage used for Run-From-Package blob hosting. Reuses the account that
  # backs AzureWebJobsStorage so we don't introduce a new resource.
  storageAccount: "iadmwebhooksprodstg"
  storageContainer: "app-package-arion-func"

steps:
  - task: NodeTool@0
    displayName: "Use Node $(node_version)"
    inputs:
      versionSpec: "$(node_version)"

  - checkout: self
    clean: true

  - script: |
      set -e
      echo "Working directory:"
      pwd
      ls -la

      echo "Installing dependencies..."
      npm install

      if npm run | grep -q " contract-check"; then
        echo "Running contract-check..."
        npm run contract-check
      fi

      if npm run | grep -q " build"; then
        echo "Running build..."
        npm run build
      fi

      echo "Pruning dev dependencies..."
      npm prune --omit=dev

      echo "Done."
    displayName: "npm install (+ optional contract-check/build) + prune"

  - script: |
      set -e
      cd "$(System.DefaultWorkingDirectory)"
      echo "Creating deployment zip..."
      zip -r "$(Build.ArtifactStagingDirectory)/drop.zip" . \
        -x ".git/*" \
           ".gitignore" \
           "azure-pipelines.yml" \
           "*.log" \
           "**/*.log"
      ls -lh "$(Build.ArtifactStagingDirectory)/drop.zip"
    displayName: "Create drop.zip (includes node_modules)"

  # Deploy via Run-From-Package (RFP) — the Microsoft-recommended pattern
  # for Windows Consumption function apps. Avoids SCM entirely:
  #   1. Upload the zip to a blob container in AzureWebJobsStorage
  #   2. Generate a read-only SAS URL valid 10 years
  #   3. Set WEBSITE_RUN_FROM_PACKAGE to that URL
  #   4. Restart so the Function host picks up the new package at cold-start
  #
  # Benefits over SCM zipdeploy:
  #   - No SCM basic auth needed (stays disabled — security best practice)
  #   - No 230s SCM timeout on large packages (common on Consumption)
  #   - Atomic swap — old package stays runnable if deploy aborts mid-way
  #   - Same pattern the Azure Functions team recommends for CI/CD since 2021
  - task: AzureCLI@2
    displayName: "Deploy via Run-From-Package"
    inputs:
      azureSubscription: "$(azureSubscription)"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        set -e

        BLOB_NAME="arion-func-$(Build.BuildId)-$(Build.SourceVersion).zip"
        ZIP_PATH="$(Build.ArtifactStagingDirectory)/drop.zip"

        # Use the storage account key (SP has management Contributor which can
        # call listKeys). Avoids needing separate data-plane RBAC roles.
        echo "Fetching storage account key..."
        ACCOUNT_KEY=$(az storage account keys list \
          --account-name "$(storageAccount)" \
          --query "[0].value" -o tsv)

        if [ -z "$ACCOUNT_KEY" ]; then
          echo "ERROR: Could not fetch storage account key"
          exit 1
        fi

        echo "Ensuring blob container $(storageContainer) exists..."
        az storage container create \
          --account-name "$(storageAccount)" \
          --account-key "$ACCOUNT_KEY" \
          --name "$(storageContainer)" \
          --public-access off \
          --only-show-errors \
          2>&1 || echo "(container may already exist)"

        echo "Uploading $ZIP_PATH to $(storageAccount)/$(storageContainer)/$BLOB_NAME..."
        az storage blob upload \
          --account-name "$(storageAccount)" \
          --account-key "$ACCOUNT_KEY" \
          --container-name "$(storageContainer)" \
          --name "$BLOB_NAME" \
          --file "$ZIP_PATH" \
          --overwrite \
          --only-show-errors

        echo "Generating 10-year read-only SAS..."
        EXPIRY=$(date -u -d "+3650 days" +"%Y-%m-%dT%H:%MZ")
        SAS_URL=$(az storage blob generate-sas \
          --account-name "$(storageAccount)" \
          --account-key "$ACCOUNT_KEY" \
          --container-name "$(storageContainer)" \
          --name "$BLOB_NAME" \
          --permissions r \
          --expiry "$EXPIRY" \
          --https-only \
          --full-uri \
          --output tsv)

        if [ -z "$SAS_URL" ]; then
          echo "ERROR: SAS generation returned empty result"
          exit 1
        fi

        echo "Setting WEBSITE_RUN_FROM_PACKAGE on $(functionAppName)..."
        az functionapp config appsettings set \
          --name "$(functionAppName)" \
          --resource-group "$(functionAppResourceGroup)" \
          --settings "WEBSITE_RUN_FROM_PACKAGE=$SAS_URL" \
          --output none

        echo "Restarting $(functionAppName) to load new package..."
        az functionapp restart \
          --name "$(functionAppName)" \
          --resource-group "$(functionAppResourceGroup)"

        echo "Deployment complete. Function app is running the new package."
