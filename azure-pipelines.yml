trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  node_version: "22.x"
  functionAppName: "func-iadm-arion-prod"
  functionAppResourceGroup: "rg-core-shared-prod"
  azureSubscription: "IADM-Prod-ARM"

steps:
  - task: NodeTool@0
    displayName: "Use Node $(node_version)"
    inputs:
      versionSpec: "$(node_version)"

  - checkout: self
    clean: true

  - script: |
      set -e
      echo "Working directory:"
      pwd
      ls -la

      echo "Installing dependencies..."
      npm install

      if npm run | grep -q " contract-check"; then
        echo "Running contract-check..."
        npm run contract-check
      fi

      if npm run | grep -q " build"; then
        echo "Running build..."
        npm run build
      fi

      echo "Pruning dev dependencies..."
      npm prune --omit=dev

      echo "Done."
    displayName: "npm install (+ optional contract-check/build) + prune"

  - script: |
      set -e
      cd "$(System.DefaultWorkingDirectory)"
      echo "Creating deployment zip..."
      zip -r "$(Build.ArtifactStagingDirectory)/drop.zip" . \
        -x ".git/*" \
           ".gitignore" \
           "azure-pipelines.yml" \
           "*.log" \
           "**/*.log"
      ls -lh "$(Build.ArtifactStagingDirectory)/drop.zip"
    displayName: "Create drop.zip (includes node_modules)"

  # Deploy via `az webapp deploy` — uses the modern OneDeploy endpoint at
  # /api/publish, which accepts AAD bearer tokens from the pipeline service
  # principal. This lets SCM basic auth stay DISABLED (security best practice
  # in Azure 2024+). The SP needs Website Contributor RBAC on the function app,
  # which is granted via the AzureCLI@2 service connection.
  - task: AzureCLI@2
    displayName: "Deploy drop.zip to $(functionAppName) via OneDeploy"
    inputs:
      azureSubscription: "$(azureSubscription)"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        set -e
        echo "Deploying zip package via az webapp deploy (OneDeploy)..."
        az webapp deploy \
          --name "$(functionAppName)" \
          --resource-group "$(functionAppResourceGroup)" \
          --src-path "$(Build.ArtifactStagingDirectory)/drop.zip" \
          --type zip \
          --track-status false \
          --async false
        echo "Deployment complete."
