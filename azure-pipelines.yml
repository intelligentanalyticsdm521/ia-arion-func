trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  node_version: "22.x"
  webAppName: "app-arion-api-prod"
  azureSubscription: "<YOUR_AZDO_SERVICE_CONNECTION_NAME>"

steps:
  - task: NodeTool@0
    displayName: "Use Node $(node_version)"
    inputs:
      versionSpec: "$(node_version)"

  - checkout: self
    clean: true

  # Keep this aligned with your existing pattern.
  # If contract-check doesn't exist yet in arion-api, either add it OR remove that line.
  - script: |
      echo "Working directory:"
      pwd
      ls -la
      npm ci
      npm run contract-check
    displayName: "npm ci + contract-check"

  - task: ArchiveFiles@2
    displayName: "Archive app into drop.zip"
    inputs:
      rootFolderOrFile: "$(System.DefaultWorkingDirectory)"
      includeRootFolder: false
      archiveType: "zip"
      archiveFile: "$(Build.ArtifactStagingDirectory)/drop.zip"
      replaceExistingArchive: true

  - task: AzureWebApp@1
    displayName: "Deploy drop.zip to $(webAppName)"
    inputs:
      azureSubscription: "$(azureSubscription)"
      appName: "$(webAppName)"
      package: "$(Build.ArtifactStagingDirectory)/drop.zip"