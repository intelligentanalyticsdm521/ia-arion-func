trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  node_version: "22.x"
  functionAppName: "func-iadm-arion-prod"
  functionAppResourceGroup: "rg-apps-prod"
  azureSubscription: "IADM-Prod-ARM"

steps:
  - task: NodeTool@0
    displayName: "Use Node $(node_version)"
    inputs:
      versionSpec: "$(node_version)"

  - checkout: self
    clean: true

  - script: |
      set -e
      echo "Working directory:"
      pwd
      ls -la

      if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
        echo "Lockfile found. Running npm ci..."
        npm ci
      else
        echo "No lockfile found. Running npm install..."
        npm install
      fi

      if npm run | grep -q " contract-check"; then
        echo "Running contract-check..."
        npm run contract-check
      fi

      if npm run | grep -q " build"; then
        echo "Running build..."
        npm run build
      fi
    displayName: "Install deps (+ optional contract-check/build)"

  - task: ArchiveFiles@2
    displayName: "Archive function app into drop.zip"
    inputs:
      rootFolderOrFile: "$(System.DefaultWorkingDirectory)"
      includeRootFolder: false
      archiveType: "zip"
      archiveFile: "$(Build.ArtifactStagingDirectory)/drop.zip"
      replaceExistingArchive: true
      verbose: true

  # --- FLEX FIX: ensure DEPLOYMENT_STORAGE_CONNECTION_STRING has a real value ---
  - task: AzureCLI@2
    displayName: "Flex preflight: force DEPLOYMENT_STORAGE_CONNECTION_STRING"
    inputs:
      azureSubscription: "$(azureSubscription)"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        set -e

        echo "Reading AzureWebJobsStorage..."
        AZWJS=$(az functionapp config appsettings list \
          --name "$(functionAppName)" \
          --resource-group "$(functionAppResourceGroup)" \
          --query "[?name=='AzureWebJobsStorage'].value | [0]" -o tsv)

        if [ -z "$AZWJS" ]; then
          echo "ERROR: AzureWebJobsStorage is missing or empty. Flex deployment cannot proceed."
          exit 1
        fi

        echo "Setting DEPLOYMENT_STORAGE_CONNECTION_STRING to match AzureWebJobsStorage (required by Flex deployment config)..."
        az functionapp config appsettings set \
          --name "$(functionAppName)" \
          --resource-group "$(functionAppResourceGroup)" \
          --settings DEPLOYMENT_STORAGE_CONNECTION_STRING="$AZWJS" \
          1>/dev/null

        echo "Restarting function app to ensure settings are loaded..."
        az functionapp restart \
          --name "$(functionAppName)" \
          --resource-group "$(functionAppResourceGroup)" \
          1>/dev/null

        echo "Preflight complete."

  # --- Supported Flex deployment task ---
  - task: AzureFunctionApp@2
    displayName: "Deploy drop.zip to $(functionAppName) (Flex Consumption)"
    inputs:
      azureSubscription: "$(azureSubscription)"
      appType: "functionAppLinux"
      appName: "$(functionAppName)"
      package: "$(Build.ArtifactStagingDirectory)/drop.zip"
      isFlexConsumption: true